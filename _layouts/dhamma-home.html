---
layout: default
---
<main id="main" class="dh-home" role="main">
  <header class="dh-home__intro">
    <p class="dh-home__eyebrow">DhammaReader 연구노트</p>
    <h1>불교 자료를 찾고 정리하며</h1>
    <p>한국어 불교 자료를 살피고 DhammaReader를 만드는 과정에서 확인한 문제와 결정을 기록합니다.</p>
    <a class="dh-home__reader-link" href="https://dhammareader.com">경전 읽기 <span aria-hidden="true">↗</span></a>
  </header>

  <section class="dh-home__posts" aria-labelledby="dh-posts-title">
    <h2 id="dh-posts-title">글</h2>
    {% for post in site.posts %}
    <article class="dh-home__post">
      <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: site.date_format }}</time>
      <div>
        <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        <p>{{ post.excerpt | strip_html | strip }}</p>
      </div>
      <span class="dh-home__post-arrow" aria-hidden="true">↗</span>
    </article>
    {% endfor %}
  </section>
</main>
